# Spark defaults for the log-analytics cluster.
# Every job inherits these, so spark-submit lines stay short.

spark.master                       spark://spark-master:7077

# Job history survives the job, so you can show the DAG in a demo.
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory      hdfs://namenode:8020/spark-logs

# Managed tables land in HDFS, not in the container's local filesystem.
spark.sql.warehouse.dir            hdfs://namenode:8020/user/hive/warehouse

# Sized for a laptop. Raise these if you give Docker more memory.
spark.driver.memory                2g
spark.executor.memory              2g
spark.executor.cores               2

# 200 is the default and is far too many for a dataset this size — it produces
# hundreds of tiny files and wastes more time in scheduling than in work.
spark.sql.shuffle.partitions       16

# The NASA logs carry a -0400 offset. Reading in the server's local time makes
# "peak hour" mean what a reader expects.
spark.sql.session.timeZone         America/New_York

spark.serializer                   org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled         true
