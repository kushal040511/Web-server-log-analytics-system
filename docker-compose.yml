# Log Analytics System for a Web Server — local cluster
name: loganalytics

# All services run the same image; the command selects the role.
x-base: &base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: loganalytics/hadoop-spark:3.3.6-3.5.3
  restart: unless-stopped

# Config is mounted read-only so you can edit it without rebuilding.
x-conf-volumes: &conf-volumes
  - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
  - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
  - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
  - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

services:

  namenode:
    <<: *base
    container_name: namenode
    hostname: namenode
    command: ["namenode"]
    ports:
      - "9870:9870"          # HDFS web UI  -> http://localhost:9870
      - "8020:8020"          # HDFS RPC
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  datanode1:
    <<: *base
    container_name: datanode1
    hostname: datanode1
    command: ["datanode"]
    depends_on: [namenode]
    volumes:
      - datanode1-data:/hadoop/dfs/data
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  datanode2:
    <<: *base
    container_name: datanode2
    hostname: datanode2
    command: ["datanode"]
    depends_on: [namenode]
    volumes:
      - datanode2-data:/hadoop/dfs/data
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-master:
    <<: *base
    container_name: spark-master
    hostname: spark-master
    command: ["spark-master"]
    depends_on: [namenode]
    ports:
      - "8080:8080"          # Spark master UI -> http://localhost:8080
      - "7077:7077"
    volumes: *conf-volumes

  spark-worker:
    <<: *base
    container_name: spark-worker
    hostname: spark-worker
    command: ["spark-worker"]
    depends_on: [spark-master]
    environment:
      # 2 cores + 2g for a pipeline job's executor, 1 core + 1g for the Spark
      # Thrift Server that answers the dashboards, so neither can starve the other.
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: "3g"
    ports:
      - "8081:8081"          # Spark worker UI
    volumes: *conf-volumes

  # The container you actually work in: hdfs commands and spark-submit.
  client:
    <<: *base
    container_name: client
    hostname: client
    command: ["client"]
    depends_on: [namenode, spark-master]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./jobs:/workspace/jobs
      - ./scripts:/workspace/scripts:ro
      - ./sql:/workspace/sql:ro
      - ./data:/workspace/data
      - ./output:/workspace/output

  # Spark Thrift Server: Spark SQL over JDBC/ODBC (port 10000). BI tools connect here; every
  # dashboard query runs as a Spark SQL job on the cluster against the Parquet tables in HDFS.
  thrift:
    <<: *base
    container_name: thrift
    hostname: thrift
    command: ["thrift"]
    depends_on: [namenode, spark-master, spark-worker]
    ports:
      - "10000:10000"        # JDBC  jdbc:hive2://localhost:10000/weblogs
      - "4040:4040"          # Spark UI of the Thrift Server (the dashboard queries)
    volumes:
      - thrift-metastore:/metastore
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  # Apache Superset: the frontend. Dashboards and SQL Lab on top of the Spark Thrift Server.
  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    image: loganalytics/superset:4.1.1
    container_name: superset
    hostname: superset
    restart: unless-stopped
    depends_on: [thrift]
    environment:
      SPARK_SQL_URI: "hive://thrift:10000/weblogs"
      SUPERSET_ADMIN_PASSWORD: "admin"
    ports:
      - "8088:8088"          # dashboards -> http://localhost:8088  (admin / admin)
    volumes:
      - superset-home:/app/superset_home
      - ./superset:/app/loganalytics:ro
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro

  # Optional — job history for demos.  docker compose --profile history up -d
  spark-history:
    <<: *base
    container_name: spark-history
    hostname: spark-history
    command: ["history"]
    depends_on: [namenode]
    profiles: ["history"]
    ports:
      - "18080:18080"        # -> http://localhost:18080
    volumes: *conf-volumes

volumes:
  thrift-metastore:
  superset-home:
  namenode-data:
  datanode1-data:
  datanode2-data:
